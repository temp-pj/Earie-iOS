name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "feature/**"]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install Tuist
        run: mise install tuist

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Create Secrets.xcconfig
        run: |
          mkdir -p Configs
          echo "SERVER_HOST = ${{ secrets.SERVER_HOST }}" > Configs/Secrets.xcconfig

      - name: Run CI
        run: bundle exec fastlane ci

      - name: Run unit tests
        run: bundle exec fastlane test

      # 서버 통합 테스트는 PR에서만 돌린다. push CI는 린트, 빌드, 단위 테스트까지만 한다 (tasks.md 9번).
      # Go 버전은 fastlane/Fastfile의 INTEGRATION_SERVER_SHA 시점 서버 go.mod와 맞춘다.
      - name: Setup Go (integration)
        if: github.event_name == 'pull_request'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: false

      - name: Run integration tests
        if: github.event_name == 'pull_request'
        run: bundle exec fastlane integration
